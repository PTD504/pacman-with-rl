[project]
name = "pacman-engine"
version = "0.1.0"
description = "Customizable, headless-first Pacman game engine for reinforcement learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.2.0",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pygame-ce>=2.5.8",
    "pyyaml>=6.0.3",
    "stable-baselines3[extra]>=2.9.0",
    "tensorboard>=2.21.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "wandb>=0.30.0",
]

[project.scripts]
pacman-play = "pacman_engine.play:main"
pacman-record = "pacman_engine.recording:main"
pacman-map = "pacman_engine.maps.cli:main"


[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:launch_testing -p no:launch_ros -p no:ament_copyright -p no:ament_lint -p no:ament_flake8 -p no:ament_pep257 -p no:ament_xmllint"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu130"

